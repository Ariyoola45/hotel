apiVersion: apps/v1
kind: Deployment
metadata:
  name: horizon-hotel-management-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: react-app
  template:
    metadata:
      labels:
        app: react-app
    spec:
      containers:
        - name: react-app
          image: react-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 80