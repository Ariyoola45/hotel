# ============================================================================
# Prometheus configuration — Horizon Hotel HMS
# ============================================================================
global:
  scrape_interval: 15s        # how often Prometheus scrapes targets
  evaluation_interval: 15s    # how often alert rules are evaluated

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "alert.rules.yml"

scrape_configs:
  # Prometheus scraping itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Nginx metrics (via nginx-prometheus-exporter, which reads /stub_status
  # from the app container and re-exposes it in Prometheus format)
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          service: "horizon-hotel-app"

  # Alertmanager's own metrics
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
