# ============================================================================
# Alertmanager configuration — Horizon Hotel HMS
# ----------------------------------------------------------------------------
# Routes alerts fired by Prometheus (see alert.rules.yml) to notification
# receivers. This example ships with an email receiver and a Slack receiver,
# both commented with placeholder values — fill in real SMTP/Slack details
# before relying on this in production. Critical alerts are also configured
# to repeat more frequently than warning/info alerts.
# ============================================================================

global:
  resolve_timeout: 5m
  # smtp_smarthost: 'smtp.gmail.com:587'
  # smtp_from: 'alerts@horizonhotel.com'
  # smtp_auth_username: 'alerts@horizonhotel.com'
  # smtp_auth_password: 'REPLACE_WITH_APP_PASSWORD'

route:
  receiver: "default-receiver"
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: "critical-receiver"
      repeat_interval: 30m
    - matchers:
        - severity = "warning"
      receiver: "warning-receiver"
      repeat_interval: 2h
    - matchers:
        - severity = "info"
      receiver: "default-receiver"
      repeat_interval: 12h

receivers:
  - name: "default-receiver"
    # webhook_configs:
    #   - url: "https://hooks.slack.com/services/REPLACE/WITH/WEBHOOK"

  - name: "warning-receiver"
    # email_configs:
    #   - to: "ops-team@horizonhotel.com"
    #     send_resolved: true

  - name: "critical-receiver"
    # email_configs:
    #   - to: "oncall@horizonhotel.com"
    #     send_resolved: true
    # webhook_configs:
    #   - url: "https://hooks.slack.com/services/REPLACE/WITH/WEBHOOK"
    #     send_resolved: true

inhibit_rules:
  # If a critical alert is already firing for a given alertname, suppress
  # any warning-level alert with the same alertname to reduce noise.
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["alertname"]
